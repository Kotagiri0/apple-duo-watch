services:
  watcher:
    build: .
    image: apple-duo-watch
    container_name: apple-duo-watch
    restart: unless-stopped
    env_file: .env
    volumes:
      - duo-state:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  duo-state:
